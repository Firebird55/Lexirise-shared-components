name: Checks and release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild without moving the tag
        required: true
        type: string
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:public
      - name: Validate and package release artifacts
        run: node scripts/package-release.mjs
      - run: node scripts/validate-artifacts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release-assets
          path: |
            release/*.tgz
            release/*.zip
            release/*.json
            release/*.md
            release/*.html
            release/LICENSE
            release/SHA256SUMS
  publish:
    if: github.repository == 'Firebird55/Lexirise-shared-components' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-assets
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; publish a new version rather than replacing assets." >&2
            exit 1
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --notes "Tested release with license notices, checksums and source provenance. See RELEASE.md."
          fi
